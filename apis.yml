aid: actavis
name: Actavis
description: >-
  Actavis is a pharmaceutical manufacturer of generic, branded-generic and over-the-counter
  medicines that no longer exists as an independent company. Actavis plc renamed itself
  Allergan plc in June 2015, and on 2 August 2016 Teva Pharmaceutical Industries completed
  its acquisition of the Actavis Generics business for roughly $40.5 billion. What survives
  of the name is a product label and a handful of Teva regional affiliates such as
  PT Actavis Indonesia. The historic corporate domains (actavis.com, actavis.us,
  actavis.co.uk) are delegated to Teva nameservers and no longer answer HTTP at all, and
  actavis.bg redirects to teva.bg. Actavis published no developer program, no API, no SDKs
  and no machine-readable specification; in this industry "API" means Active Pharmaceutical
  Ingredient, not a software interface.
