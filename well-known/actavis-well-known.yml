method: probed
source: >-
  Direct HTTP probes of every host the Actavis record knows: the historic corporate
  domains (actavis.com / www.actavis.com, actavis.us, actavis.co.uk) and the one live
  Actavis-branded affiliate site (www.actavis.co.id).
name: Actavis well-known discovery probe
description: >-
  Probe of the RFC 8615 /.well-known/ discovery surface plus the common agent-facing
  discovery paths. NO document was served on any host. The historic Actavis corporate
  domains no longer run a web server at all — DNS for actavis.com, actavis.us and
  actavis.co.uk now answers from Teva nameservers (ns3/ns4/ns5.tevapharm.com) and
  www.actavis.com resolves to 192.115.248.118, a Teva address that REFUSES TCP 443
  (ECONNREFUSED) and drops TCP 80. The only reachable Actavis-branded host is
  PT Actavis Indonesia's marketing site, which 404s every discovery path.
  This file records a measured ABSENCE. No WellKnown or SecurityTxt pointer is wired
  into apis.yml, because no path returned a real document.

hosts:
  - host: www.actavis.com
    note: >-
      Historic global Actavis corporate site. Resolves to 192.115.248.118 (Teva) but the
      host refuses HTTPS (ECONNREFUSED) and does not answer HTTP. status 0 = no HTTP
      response was ever received; this is a transport-level failure, not an HTTP code.
    documents:
      - path: /.well-known/security.txt
        status: 0
        file: null
      - path: /.well-known/openid-configuration
        status: 0
        file: null
      - path: /.well-known/oauth-authorization-server
