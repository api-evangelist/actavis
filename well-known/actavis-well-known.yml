  - host: actavis.us
    note: >-
      Delegated to ns3/ns4/ns5.tevapharm.com, resolves to the same Teva address, and does
      not answer HTTP or HTTPS.
    documents:
      - path: /.well-known/security.txt
        status: 0
        file: null
      - path: /.well-known/openid-configuration
        status: 0
        file: null
      - path: /.well-known/oauth-authorization-server
